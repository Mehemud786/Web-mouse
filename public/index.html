<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Wi-Fi Mouse</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
        #trackpad { width: 100%; height: 60vh; background: #222; border: 2px dashed #444; border-radius: 12px; margin-top: 20px; display: flex; align-items: center; justify-content: center; touch-action: none; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 24px; font-size: 16px; background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Mobile A: Touchpad Controller</h2>
    <div id="trackpad">Drag here to move mouse</div>
    <div class="btn-group">
        <button onclick="sendClick('click')">Left Click</button>
        <button onclick="sendClick('right-click')">Right Click</button>
    </div>

    <script>
        const trackpad = document.getElementById('trackpad');
        let startX = 0, startY = 0;

        trackpad.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        trackpad.addEventListener('touchmove', (e) => {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let dx = currentX - startX;
            let dy = currentY - startY;
            startX = currentX;
            startY = currentY;

            sendData({ action: 'move', dx: dx, dy: dy });
        });

        function sendClick(actionType) {
            sendData({ action: actionType, dx: 0, dy: 0 });
        }

        function sendData(data) {
            fetch('/api/mouse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
